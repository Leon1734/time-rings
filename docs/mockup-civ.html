<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>设计简图 · 文明支流体系（多河归海）</title>
<style>
  html,body{margin:0;height:100%;background:#02040a;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;box-shadow:0 0 70px rgba(90,130,255,.14)}
  #note{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);color:#6b7688;font:12px/1 "Microsoft YaHei";letter-spacing:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1600" height="900"></canvas></div>
<div id="note">设 计 简 图 · 文明支流体系走廊布局 —— 确认后开发</div>
<script>
'use strict';
(function(){
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1600, H = 900;

function hexA(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')';}

/* 主河道中心线（自左上蜿蜒至右下入海） */
const P=[[-90,509],[45,590],[180,433],[315,271],[450,344],[585,543],[720,574],[855,391],[990,265],[1125,383],[1260,570],[1395,549],[1580,350]];
function catmull(t){
  const n=P.length-1, f=Math.min(0.9999,Math.max(0,t))*n, i=Math.floor(f), u=f-i, u2=u*u, u3=u2*u;
  const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[Math.min(n,i+1)],p3=P[Math.min(n,i+2)];
  return [
    0.5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)];
}
const S=260, CPT=[];
for(let i=0;i<=S;i++) CPT.push(catmull(i/S));
function normalAt(i){const a=CPT[Math.max(0,i-1)],b=CPT[Math.min(S,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l];}
function widthAt(t){return 9+26*Math.pow(t,1.3);}
function ribbonPath(t0,t1,k){
  ctx.beginPath();
  const i0=Math.round(t0*S),i1=Math.round(t1*S);
  for(let i=i0;i<=i1;i++){const t=i/S,n=normalAt(i),w=widthAt(t)*k;
    const x=CPT[i][0]+n[0]*w,y=CPT[i][1]+n[1]*w;i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  for(let i=i1;i>=i0;i--){const t=i/S,n=normalAt(i),w=widthAt(t)*k;
    ctx.lineTo(CPT[i][0]-n[0]*w,CPT[i][1]-n[1]*w);}
  ctx.closePath();
}
/* 支流中心线 = 主线平移 offset（外推方向 side: +1 右岸 / -1 左岸） */
function tribPath(t0,t1,side,base,wob){
  const pts=[];
  const i0=Math.round(t0*S),i1=Math.round(t1*S);
  for(let i=i0;i<=i1;i++){const t=i/S,off=base+Math.sin(t*9)*wob;
    pts.push([CPT[i][0],CPT[i][1]+side*off]);}
  return pts;
}
function strokePts(pts,w,color,alpha){
  ctx.beginPath();
  pts.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); });
  ctx.strokeStyle=hexA(color,alpha); ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
}

/* 四条文明支流定义 */
const CIVS=[
 {name:'🐉 中国支流', short:'中国', side:1, base:120, wob:12, from:0.545, to:1.0, color:'#e8b84a', lamps:48,
  span:'二里头 → 今天', totems:['🐉','🏮']},
 {name:'🏛️ 希腊·罗马支流', short:'希腊·罗马', side:-1, base:120, wob:12, from:0.60, to:0.90, color:'#7fb0e8', lamps:18,
  span:'特洛伊 → 拜占庭余晖', totems:['🏛️','🦅']},
 {name:'🕌 阿拉伯·伊斯兰支流', short:'阿拉伯·伊斯兰', side:1, base:205, wob:10, from:0.80, to:1.0, color:'#6fd0a8', lamps:7,
  span:'希吉拉 → 今天', totems:['🕌','🌙']},
 {name:'🕉️ 印度支流', short:'印度', side:-1, base:205, wob:10, from:0.63, to:0.98, color:'#e89f6f', lamps:7,
  span:'印度河文明 → 民族觉醒', totems:['🕉️','🪷']}
];

let dashOff=0;
function draw(time){
  const T=time/1000;
  /* 星空 */
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#03050d');sky.addColorStop(.55,'#071022');sky.addColorStop(1,'#0c152c');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const rnd=(function(){let s=424242;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})();
  for(let i=0;i<420;i++){const x=rnd()*W,y=rnd()*H,r=rnd()*1.2+0.2;
    const tw=0.55+0.45*Math.sin(T*1.3+i);
    ctx.fillStyle='rgba(215,225,255,'+(0.2+rnd()*0.45)*tw+')';
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

  /* 主河道 */
  ribbonPath(0,1,1.05);ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fill();
  ribbonPath(0,1,1);ctx.fillStyle='#0e2c3d';ctx.fill();
  ctx.save();ctx.setLineDash([26,38]);
  [-0.45,0.1,0.45].forEach(function(off,k){
    ctx.beginPath();
    for(let i=0;i<=S;i++){const t=i/S,n=normalAt(i),w=widthAt(t)*off;
      const x=CPT[i][0]+n[0]*w,y=CPT[i][1]+n[1]*w;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.strokeStyle='rgba(150,210,235,0.14)';ctx.lineWidth=2.4;ctx.lineDashOffset=dashOff-k*10;ctx.stroke();
  });
  ctx.restore();

  /* 支流：先画河床岸影，再画彩色水面 */
  CIVS.forEach(function(c){
    const pts=tribPath(c.from,c.to,c.side,c.base,c.wob);
    strokePts(pts,widthAt((c.from+c.to)/2)*2.5,'#000000',0.45);
    strokePts(pts,widthAt((c.from+c.to)/2)*2.0,c.color,0.30);
    strokePts(pts,2.2,c.color,0.85);
    /* 河灯微点 */
    const rnd2=(function(){let s=c.lamps*7;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})();
    for(let i=0;i<c.lamps;i++){
      const p=pts[Math.floor(rnd2()*pts.length)];
      ctx.fillStyle=hexA('#fff8d8',0.9);
      ctx.beginPath();ctx.arc(p[0],p[1],2.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=hexA(c.color,0.3);
      ctx.beginPath();ctx.arc(p[0],p[1],5.5,0,Math.PI*2);ctx.fill();
    }
  });

  /* 汇流三角洲 + 入海口 */
  const sea=CPT[S];
  const sea2=[sea[0]+24, sea[1]+10];
  let g=ctx.createRadialGradient(sea2[0],sea2[1],0,sea2[0],sea2[1],170);
  g.addColorStop(0,'rgba(255,200,120,0.8)');g.addColorStop(0.4,'rgba(255,170,100,0.25)');g.addColorStop(1,'rgba(255,170,100,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sea2[0],sea2[1],170,0,Math.PI*2);ctx.fill();

  /* 支流名牌与首尾图腾 */
  ctx.textAlign='center';
  CIVS.forEach(function(c,idx){
    const pts=tribPath(c.from,c.to,c.side,c.base,c.wob);
    const mid=pts[Math.floor(pts.length/2)];
    const head=pts[0],tail=pts[pts.length-1];
    ctx.font='600 15px "Microsoft YaHei"';
    ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;
    ctx.fillStyle=hexA(c.color,0.95);
    ctx.fillText(c.name,mid[0],mid[1]-14);
    ctx.font='11px "Microsoft YaHei"';
    ctx.fillStyle='rgba(200,195,180,0.75)';
    ctx.fillText(c.span+' · '+c.lamps+' 盏',mid[0],mid[1]+4);
    ctx.shadowBlur=0;
    /* 首尾图腾 */
    ctx.font='22px "Segoe UI Emoji"';
    ctx.fillText(c.totems[0],head[0],head[1]-8);
    ctx.fillText(c.totems[1],tail[0],tail[1]-8);
  });

  /* 主线纪元徽标（示意） */
  [['原初宇宙',0.03],['古生代',0.33],['恐龙',0.47],['轴心时代',0.70],['文艺复兴',0.87],['信息时代',0.985]].forEach(function(e){
    const i=Math.round(e[1]*S),n=normalAt(i);
    const x=CPT[i][0]-n[0]*widthAt(e[1])*1.9,y=CPT[i][1]-n[1]*widthAt(e[1])*1.9;
    ctx.font='600 13px "Microsoft YaHei"';
    ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=5;
    ctx.fillStyle='rgba(255,230,192,0.9)';
    ctx.fillText(e[0],x,y);ctx.shadowBlur=0;
  });

  /* 标注徽章 */
  function badge(x,y,n){
    ctx.fillStyle='rgba(8,12,20,0.85)';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#ffd27f';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#ffd27f';ctx.font='600 12px "Microsoft YaHei"';ctx.fillText(String(n),x,y+4);
  }
  badge(CPT[Math.round(0.545*S)][0]+8,CPT[Math.round(0.545*S)][1]+58,1);
  const gr=tribPath(0.60,0.90,-1,78,16);badge(gr[Math.floor(gr.length/2)][0]-56,gr[Math.floor(gr.length/2)][1],2);
  badge(1330,320,3);badge(300,600,4);

  /* 标注说明 */
  ctx.fillStyle='#8b93a4';ctx.font='12.5px "Microsoft YaHei"';
  ctx.fillText('① 中国支流（现有，右侧内道）   ② 希腊·罗马支流（左侧内道·18 盏）   ③ 阿拉伯·伊斯兰支流（右侧外道·7 盏）   ④ 印度支流（左侧外道·7 盏）',W/2,848);
  ctx.fillStyle='#6b7688';ctx.font='12px "Microsoft YaHei"';
  ctx.fillText('丘陵在全部四条走廊自动让位 · 各支流配专属名牌/首尾图腾/里程碑拱门 · 问答范围与图鉴同步扩展「按文明筛选」',W/2,872);
}
function frame(t){dashOff=-t/1000*34;draw(t);requestAnimationFrame(frame);}
draw(0);
window.__drawMock = draw;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
